<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre — acesso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="fundo-vault">
  <div class="anel anel-1"></div>
  <div class="anel anel-2"></div>
  <div class="anel anel-3"></div>
</div>

<main class="tela-auth">
  <div class="marca">
    <svg class="marca-icone" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="20" width="36" height="24" rx="3" stroke="currentColor" stroke-width="2.5"/>
      <path d="M14 20V14C14 8.5 18.5 4 24 4C29.5 4 34 8.5 34 14V20" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="24" cy="30" r="3.5" fill="currentColor"/>
      <path d="M24 33.5V38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span class="marca-texto">COFRE</span>
  </div>

  <div class="cartao-auth">
    <div class="abas">
      <button class="aba ativa" data-aba="login" type="button">Entrar</button>
      <button class="aba" data-aba="registro" type="button">Criar conta</button>
    </div>

    <p class="linha-status" id="mensagemAuth" role="status"></p>

    <form id="formLogin" class="form-auth">
      <label class="campo">
        <span>E-mail</span>
        <input type="email" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
      </label>
      <label class="campo">
        <span>Senha mestra</span>
        <input type="password" name="senha" placeholder="••••••••" required autocomplete="current-password">
      </label>
      <button type="submit" class="botao-principal">
        <span>Destravar cofre</span>
      </button>
    </form>

    <form id="formRegistro" class="form-auth oculto">
      <label class="campo">
        <span>E-mail</span>
        <input type="email" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
      </label>
      <label class="campo">
        <span>Senha mestra</span>
        <input type="password" name="senha" placeholder="mínimo 8 caracteres" required autocomplete="new-password">
      </label>
      <p class="dica-campo">Essa é a única senha que você precisa lembrar. Ela protege todas as outras.</p>
      <button type="submit" class="botao-principal">
        <span>Criar cofre</span>
      </button>
    </form>

    <div class="divisor"><span>ou</span></div>

    <a href="http://localhost:3000/auth/google" class="botao-google">
      <svg viewBox="0 0 48 48" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span>Entrar com o Google</span>
    </a>
  </div>

  <p class="rodape-auth">Criptografia AES-256 de ponta a ponta · seus dados, sua chave</p>
</main>

<script src="auth.js"></script>
</body>
</html>
